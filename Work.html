<style id="vz-style">
/* 列表模式時，原本的 .app 不顯示（由村莊接管畫面） */
body.v-mode .app{visibility:hidden}

/* 切換按鈕（村莊 ⇄ 列表）：列表時放在右上角標題列，村莊時放在村莊標題列 */
#vToggle{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border-radius:999px;
  border:1px solid rgba(243,217,163,.5);background:linear-gradient(160deg,rgba(243,217,163,.2),rgba(243,217,163,.05));
  color:#F6E3B4;font:800 13px/1 "Noto Serif TC","Songti TC",serif;letter-spacing:.5px;cursor:pointer;flex:0 0 auto;
  white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .15s}
#vToggle:active{transform:scale(.94)}

/* 村莊外框 */
#village{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,500px);height:100%;z-index:120;
  display:none;flex-direction:column;overflow:hidden;color:#F3EBD3;
  background:radial-gradient(120% 70% at 50% 0%,#1F5139 0%,#0E2A1E 55%,#061510 100%)}
body.v-mode #village{display:flex}
#vFlash{position:absolute;inset:0;pointer-events:none;z-index:9;opacity:0;
  background:radial-gradient(circle,rgba(255,236,170,.55),transparent 70%)}
#vFlash.on{animation:vFlash .9s ease-out}
@keyframes vFlash{0%{opacity:1}100%{opacity:0}}

/* 標題列與角色資訊 */
#vHead{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
#vHead::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,#E7C27A,transparent)}
.vAv{width:44px;height:44px;border-radius:50%;flex:0 0 auto;border:2px solid #E7C27A;background:#0C2219;overflow:hidden;
  display:grid;place-items:center;font-size:20px;box-shadow:0 0 0 3px rgba(231,194,122,.15)}
.vAv img{width:100%;height:100%;object-fit:cover}
#vInfo{flex:1;min-width:0}
#vName{font:900 16px/1.2 "Noto Serif TC","Songti TC",serif;color:#F6E3B4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vTitle{font-size:11.5px;letter-spacing:1.5px;color:rgba(243,217,163,.7);margin-top:2px}
#vLv{font:800 22px/1 "Courier New",monospace;color:#F3D9A3;text-shadow:0 2px 0 #000}
#vXp{position:relative;z-index:3;margin:0 14px 8px;height:10px;border-radius:99px;background:rgba(0,0,0,.45);
  box-shadow:inset 0 0 0 1px rgba(231,194,122,.35);overflow:hidden}
#vXpFill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#8A6428,#E7C27A,#FFF1CC,#E7C27A);
  box-shadow:0 0 12px rgba(231,194,122,.6);transition:width .6s}
#vMeta{position:relative;z-index:3;display:flex;justify-content:space-between;margin:0 16px 10px;font-size:12px;color:rgba(243,236,220,.72)}

/* 地圖 */
#vMapBox{position:relative;z-index:2;padding:0 8px}
#vWrap{position:relative;width:100%;aspect-ratio:3/2;border-radius:16px;overflow:hidden;
  box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 2px rgba(231,194,122,.45)}
#vCv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  cursor:pointer;touch-action:manipulation}
#vLbls{position:absolute;inset:0;pointer-events:none}
.vLbl{position:absolute;transform:translate(-50%,-100%);padding:3px 6px;border-radius:6px;white-space:nowrap;

  border:1px solid rgba(231,194,122,.55);box-shadow:0 2px 0 #000;transition:background .2s,color .2s}
.vLbl.hot{background:#E7C27A;color:#0B1A12}

/* 底部：對話卡與快速清單 */
#vBottom{position:relative;z-index:3;flex:1;min-height:0;overflow-y:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px))}
#vCard{background:linear-gradient(170deg,#173D2D,#0B2119);border:1.5px solid rgba(231,194,122,.5);border-radius:18px;
  padding:14px;box-shadow:0 14px 30px rgba(0,0,0,.35);animation:vIn .35s ease both}
#vCard[hidden],#vGridBox[hidden]{display:none}
@keyframes vIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vc-h{display:flex;align-items:center;gap:10px}
.vc-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:0 0 auto;border:1px solid}
.vc-n{font:900 17px/1.2 "Noto Serif TC","Songti TC",serif;color:#F6E3B4}
.vc-r{font-size:12px;color:rgba(243,236,220,.65);margin-top:3px}
.vc-x{margin-left:auto;flex:0 0 auto}
.vc-t{margin:12px 0;font-size:14px;line-height:1.7;color:#EFE9D6;background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px}
.vc-btns{display:flex;flex-wrap:wrap;gap:8px}
.vbtn{flex:1 1 auto;min-height:46px;padding:0 14px;border-radius:999px;border:1px solid rgba(231,194,122,.5);
  background:linear-gradient(170deg,#FBE9B9,#E7C27A 55%,#C79A4B);color:#14201A;
  font:800 14px/1 "Noto Serif TC","Songti TC",serif;letter-spacing:.5px;box-shadow:0 4px 0 #7A5520;cursor:pointer;transition:transform .12s}
.vbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #7A5520}
.vbtn.g{background:rgba(243,217,163,.08);color:#F6E3B4;border-color:rgba(243,217,163,.3);box-shadow:none}
.vbtn.sm{flex:0 0 auto;min-height:36px;padding:0 12px}
#vHint{font-size:12.5px;color:rgba(243,236,220,.72);text-align:center;margin:0 0 10px;letter-spacing:.3px}
#vGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vchip{display:flex;align-items:center;gap:6px;min-height:44px;padding:8px 10px;border-radius:14px;
  border:1px solid rgba(231,194,122,.3);background:rgba(255,255,255,.04);color:#F3EBD3;
  font:700 13px/1.2 "Noto Sans TC",sans-serif;cursor:pointer;text-align:left;transition:transform .12s,background .2s}
.vchip span{font-size:17px}
.vchip:active{transform:scale(.96);background:rgba(231,194,122,.16)}

<script>
(function(){
'use strict';
/* =========================================================
   智囊村莊 · 像素村（整合版）
   村莊只是入口：所有功能都呼叫原本的函式（openDept、
   openCollector、openCards、openLibrary、openResults、
   openView、runAllDepartments），行為與列表模式完全一致。
   升級以「成品數量」為準：每則圖文或短影音成品 +1 點。
   ========================================================= */

const VW=24, VH=16, T=16, W=VW*T, H=VH*T;
const cv=document.getElementById('vCv');
const g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
const bgC=document.createElement('canvas'); bgC.width=W; bgC.height=H;
const b=bgC.getContext('2d'); b.imageSmoothingEnabled=false;

const key=(x,y)=>x+','+y;
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function fillOn(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}

/* ---------- 版面資料 ---------- */
const BLDS=[
  {x:2, y:2, w:4,h:2, roof:'#7A3E2A', wall:'#EADCB8', win:2},  // 大長老殿
  {x:9, y:1, w:3,h:2, roof:'#2E5A8A', wall:'#E9E0C8', win:1},  // 城主府
  {x:13,y:2, w:3,h:2, roof:'#5A4A8A', wall:'#E9E0C8', win:2},  // 成品館
  {x:3, y:6, w:3,h:2, roof:'#B0701F', wall:'#EADCB8', win:1},  // 故事小屋
  {x:8, y:6, w:3,h:2, roof:'#1F7A62', wall:'#E9E0C8', win:1},  // 核心書院
  {x:14,y:6, w:2,h:2, roof:'#9A5424', wall:'#EADCB8', win:1},  // 影音舞台
  {x:16,y:6, w:3,h:2, roof:'#2E6FB0', wall:'#E9E0C8', win:2},  // 市場店
  {x:20,y:9, w:2,h:2, roof:'#6B4E9E', wall:'#D9D0C0', win:1},  // 資料塔
  {x:10,y:10,w:3,h:2, roof:'#7A4E22', wall:'#EADCB8', win:1},  // 教學工坊
  {x:2, y:10,w:3,h:2, roof:'#2E6A5A', wall:'#E9E0C8', win:1},  // 素材倉
];
const POND={x0:17,y0:2,x1:21,y1:4};
const TREES=[[1,7],[22,6],[18,13],[5,14],[16,14],[22,13],[1,14],[8,14],[13,14],[21,5],[6,3]];
const LANTERNS=[[7,5],[13,5],[7,13],[18,11],[1,4],[22,10]];
const PAVILION={x:6,y:10};
const isPath=(x,y)=>(y===9&&x>=1&&x<=22)||((x===11||x===12)&&y>=3&&y<=14);

const BLK=new Set();
for(let x=0;x<VW;x++){BLK.add(key(x,0));BLK.add(key(x,VH-1));}
for(let y=0;y<VH;y++){BLK.add(key(0,y));BLK.add(key(VW-1,y));}
BLDS.forEach(d=>{for(let yy=0;yy<d.h;yy++)for(let xx=0;xx<d.w;xx++)BLK.add(key(d.x+xx,d.y+yy));});
for(let y=POND.y0;y<=POND.y1;y++)for(let x=POND.x0;x<=POND.x1;x++)BLK.add(key(x,y));
TREES.forEach(([x,y])=>BLK.add(key(x,y)));

/* ---------- 角色外觀 ---------- */
function L(cloth,acc,kind,hair,beard){
  return {skin:'#F2C9A0',hair:hair||'#3A2A1E',cloth,pants:'#2A2A36',shoe:'#1A1210',acc,kind:kind||'hat',beard:!!beard,line:'#0B1A12'};
}
const PLAYER_LOOK={skin:'#F2C9A0',hair:'#3A2A1E',cloth:'#2F7A52',pants:'#2A2A36',shoe:'#1A1210',acc:'#E7C27A',kind:'bag',beard:false,line:'#0B1A12'};

/* ---------- NPC（對應原本各項功能） ---------- */
const NPC=[
  {id:'pipeline',name:'大長老',role:'一鍵自動完成整套文案',ic:'🧙',x:3,y:4,look:L('#5C4A8A','#E7C27A','crown','#D8D8DE',true),
   lines:['主題備妥後交給我，一次跑完整套文案。','一人一次，走完全程。'],
   acts:[['▶ 一鍵自動幫我寫',()=>go(()=>{openView('home');runAllDepartments();})],
         ['📋 回到列表首頁',()=>go(()=>openView('home'))]]},
  {id:'results',name:'成品庫',role:'圖文與短影音都收在這裡',ic:'📚',x:14,y:4,look:L('#3A4A8A','#F3D9A3','hat'),
   lines:['每產出一則成品，你的等級就會提升。'],
   acts:[['📝 圖文',()=>go(()=>openResults('final'))],['🎬 短影音',()=>go(()=>openResults('video'))]]},
  {id:'settings',name:'城主',role:'會員中心與系統設定',ic:'👑',x:10,y:3,look:L('#7A3E2A','#E7C27A','crown'),
   lines:['在這裡管理身分、背景設定與素材。'],
   acts:[['⚙️ 打開設定',()=>go(()=>openView('settings'))]]},
  {id:'icebreak',name:'故事破冰',role:'用比喻故事讓人停下來',ic:'📖',x:4,y:8,look:L('#C7902B','#FFF1CC','hat'),
   lines:['用比喻故事，讓人停下來產生共鳴。'],
   acts:[['✍️ 進入工坊',()=>go(()=>openDept('icebreak'))]]},
  {id:'core',name:'核心處理',role:'把健康道理講清楚',ic:'🌿',x:9,y:8,look:L('#1F8A72','#CFEFE3','hat'),
   lines:['道理說明白，案例只說個人感受。'],
   acts:[['✍️ 進入工坊',()=>go(()=>openDept('core'))]]},
  {id:'video',name:'影音內容',role:'把圖文改寫成一分鐘口播',ic:'🎬',x:15,y:8,look:L('#B5652E','#FFD9A8','hat'),
   lines:['鏡頭前要有節奏，三秒內抓住人。'],
   acts:[['✍️ 進入工坊',()=>go(()=>openDept('video'))]]},
  {id:'market',name:'市場經營',role:'給新手的完整上手流程',ic:'📈',x:17,y:8,look:L('#2E6FB0','#CFE3FA','hat'),
   lines:['一步一步來，我教你怎麼開始。'],
   acts:[['✍️ 進入工坊',()=>go(()=>openDept('market'))]]},
  {id:'collector',name:'資料收集',role:'每日收集話題並存檔',ic:'🛰️',x:20,y:11,look:L('#6B4E9E','#E2D6FA','hat'),
   lines:['選好方向告訴我，我去打探消息。'],
   acts:[['🛰️ 開始收集',()=>go(()=>openCollector())]]},
  {id:'warmup',name:'暖身邀約',role:'從暖身到自然邀約',ic:'🤝',x:6,y:12,look:L('#8A5A2E','#F3D9A3','hat'),
   lines:['不推銷，先交朋友。'],
   acts:[['✍️ 進入工坊',()=>go(()=>openDept('warmup'))]]},
  {id:'cards',name:'教學工坊',role:'教材做成問答卡',ic:'🎴',x:11,y:12,look:L('#A8782E','#FBE9B9','hat'),
   lines:['拿來教材，我幫你鍛造成卡片。'],
   acts:[['🎴 打開工坊',()=>go(()=>openCards())]]},
  {id:'library',name:'素材庫',role:'上傳與管理備用資料',ic:'📁',x:3,y:12,look:L('#2E7A6A','#CFEFE3','bag'),
   lines:['檔案留存一次，之後勾選即可使用。'],
   acts:[['📁 打開素材庫',()=>go(()=>openLibrary())]]},
];
const npcAt=new Map();
NPC.forEach(n=>npcAt.set(key(n.x,n.y),n));
NPC.forEach(n=>BLK.has(key(n.x,n.y)) && console.warn('NPC 位置被障礙佔用：',n.name));

/* ---------- 導覽：切換村莊 / 列表 ---------- */
function setMode(m){
  document.body.classList.toggle('v-mode', m==='village');
  placeToggle();
  if(m==='village'){ hideCard(); renderVillage(); window.scrollTo(0,0); }
}
function go(fn){ setMode('list'); fn(); }

const btn=document.createElement('button');
btn.id='vToggle'; btn.type='button';
btn.onclick=()=>setMode(document.body.classList.contains('v-mode')?'list':'village');
function placeToggle(){
  const isV=document.body.classList.contains('v-mode');
  btn.textContent = isV ? '☰ 列表' : '🏘 村莊';
  if(isV){
    document.getElementById('vHead').insertBefore(btn, document.getElementById('vLv'));
  }else{
    const row=document.querySelector('.topbar .row');
    if(row) row.insertBefore(btn, row.querySelector('.gear'));
  }
}

/* ---------- 等級（以成品數量計算） ---------- */
function countResults(){
  return state.tasks.filter(t=>t.deptId==='final'||t.deptId==='video').length;
}
// 升到下一級所需點數：Lv1→2 需 3 點，之後每級多 1 點
function levelOf(p){
  let lv=1, need=3;
  while(p>=need){ p-=need; lv++; need=2+lv; }
  return {lv, cur:p, need};
}
const TITLES=['見習冒險者','初階軍師','中階謀士','高階智囊','名家軍師','大師軍師'];
function vzFlash(){ const f=document.getElementById('vFlash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }

function renderVillage(){
  const pts=countResults();
  const L2=levelOf(pts);
  document.getElementById('vLv').textContent='Lv.'+L2.lv;
  document.getElementById('vTitle').textContent=TITLES[Math.min(L2.lv-1,TITLES.length-1)];
  document.getElementById('vName').textContent=(typeof member!=='undefined' && member.lineName)||'冒險者';
  document.getElementById('vXpFill').style.width=(L2.cur/L2.need*100).toFixed(1)+'%';
  document.getElementById('vCount').textContent=pts+' 則成品';
  document.getElementById('vNext').textContent='距 Lv.'+(L2.lv+1)+' 還需 '+(L2.need-L2.cur)+' 則';
  const av=document.getElementById('vAv');
  const pic=(typeof member!=='undefined' && member.pic)||'';
  if(pic && av.dataset.pic!==pic){ av.dataset.pic=pic; av.innerHTML='<img src="'+pic+'" alt="">'; }
  else if(!pic && av.dataset.pic!=='none'){ av.dataset.pic='none'; av.innerHTML='<span>👤</span>'; }
  const prev=+localStorage.getItem('vz_lv')||1;
  if(L2.lv>prev){ toast('🎉 升級！Lv.'+L2.lv+'　'+TITLES[Math.min(L2.lv-1,TITLES.length-1)]); vzFlash(); }
  localStorage.setItem('vz_lv', String(L2.lv));
}

/* ---------- 對話卡 ---------- */
let curN=null;
function openCard(n){
  curN=n;
  const c=document.getElementById('vCard');
  const line=n.lines[Math.floor(Math.random()*n.lines.length)];
  c.innerHTML=
    '<div class="vc-h">'+
      '<div class="vc-ic" style="background:'+n.look.cloth+'33;border-color:'+n.look.cloth+'">'+n.ic+'</div>'+
      '<div><div class="vc-n">'+n.name+'</div><div class="vc-r">'+n.role+'</div></div>'+
      '<button class="vbtn g sm vc-x" id="vcX" type="button">✕</button>'+
    '</div>'+
    '<div class="vc-t">'+line+'</div>'+
    '<div class="vc-btns">'+n.acts.map((a,i)=>'<button class="vbtn'+(i?' g':'')+'" data-i="'+i+'" type="button">'+a[0]+'</button>').join('')+'</div>';
  c.hidden=false;
  document.getElementById('vGridBox').hidden=true;
  document.getElementById('vcX').onclick=hideCard;
  c.querySelectorAll('button[data-i]').forEach(bt=>bt.onclick=()=>{
    const act=n.acts[+bt.dataset.i]; hideCard(); act[1]();
  });
}
function hideCard(){
  curN=null;
  document.getElementById('vCard').hidden=true;
  document.getElementById('vGridBox').hidden=false;
}

/* ---------- 地圖背景（一次繪製，之後重複使用） ---------- */
function flower(X,Y,R){
  const cols=['#F4A7B9','#F7E07A','#FFFFFF','#C7A4F0'];
  const c=cols[Math.floor(R()*cols.length)];
  const ox=X+3+Math.floor(R()*9), oy=Y+3+Math.floor(R()*9);
  fillOn(b,ox,oy,2,2,c); fillOn(b,ox,oy+2,1,2,'#3E7A36');
}
function tree(X,Y){
  fillOn(b,X+2,Y+13,12,2,'rgba(0,0,0,.22)');
  fillOn(b,X+6,Y+9,4,5,'#5A3A22'); fillOn(b,X+6,Y+9,1,5,'#7A5230');
  const cx=X+8, cy=Y+6;
  const sh=[[-5,4,'#2F6B3A'],[-4,6,'#2F6B3A'],[-3,8,'#2F6B3A'],[-2,8,'#2F6B3A'],[-1,8,'#2F6B3A'],
            [0,8,'#2F6B3A'],[1,8,'#245A2F'],[2,6,'#245A2F'],[3,4,'#245A2F']];
  sh.forEach(([dy,w,col])=>fillOn(b,cx-Math.floor(w/2),cy+dy,w,1,col));
  fillOn(b,cx-4,cy-4,3,1,'#4C8F4E'); fillOn(b,cx-3,cy-3,2,1,'#4C8F4E');
  fillOn(b,cx-5,cy-2,2,1,'#3F7E45'); fillOn(b,cx+1,cy+3,3,1,'#1D4D29');
}
function building(d){
  const X=d.x*T, Y=d.y*T, W2=d.w*T, H2=d.h*T, roofH=Math.round(H2*0.46);
  fillOn(b,X+3,Y+H2,W2-3,3,'rgba(0,0,0,.28)');
  fillOn(b,X+1,Y+roofH,W2-2,H2-roofH,d.wall);
  fillOn(b,X+1,Y+H2-3,W2-2,3,'rgba(120,90,50,.25)');
  fillOn(b,X,Y,W2,roofH,d.roof);
  fillOn(b,X,Y+roofH-2,W2,2,'rgba(0,0,0,.28)');
  fillOn(b,X,Y,W2,1,'rgba(255,255,255,.28)');
  for(let rx=X+3;rx<X+W2-2;rx+=5) fillOn(b,rx,Y+3,1,roofH-6,'rgba(0,0,0,.16)');
  const wy=Y+roofH+3;
  const wx=[X+4, X+W2-9];
  for(let i=0;i<d.win;i++){
    const x0=wx[i]; if(x0===undefined) break;
    fillOn(b,x0-1,wy-1,7,6,'#3A2414');
    fillOn(b,x0,wy,5,4,'#F7D98B');
    fillOn(b,x0+2,wy,1,4,'#B88A3A');
  }
  const dx=X+Math.floor(W2/2)-3, dy=Y+H2-8;
  fillOn(b,dx-2,dy-2,10,2,d.roof);
  fillOn(b,dx,dy,6,8,'#5A3A22'); fillOn(b,dx+1,dy+1,4,7,'#3A2414');
}
function lantern(X,Y){
  fillOn(b,X+7,Y+7,2,8,'#2A1E14');
  fillOn(b,X+5,Y+4,6,4,'#8A5A2E');
  fillOn(b,X+6,Y+5,4,2,'#FFD27A');
  fillOn(b,X+6,Y+3,4,1,'#5A3A22');
  fillOn(b,X+6,Y+15,4,1,'rgba(0,0,0,.25)');
}
function pavilion(){
  const X=PAVILION.x*T, Y=PAVILION.y*T;
  fillOn(b,X+1,Y+15,2*T-2,2,'rgba(0,0,0,.22)');
  fillOn(b,X+1,Y+3,2*T-2,1,'#D9864A');
  fillOn(b,X+2,Y+4,2*T-4,4,'#B5652E');
  fillOn(b,X,Y+8,2*T,2,'#8A4A22');
  fillOn(b,X+2,Y+10,3,5,'#F3EBD3'); fillOn(b,X+2*T-5,Y+10,3,5,'#F3EBD3');
  fillOn(b,X+7,Y+11,2,2,'#8A5A2E');
}
function buildBG(){
  const R=mulberry(20261010);
  const pal=['#5E9C4E','#63A553','#58924A','#5A9A4C'];
  for(let ty=0;ty<VH;ty++)for(let tx=0;tx<VW;tx++){
    const X=tx*T, Y=ty*T;
    fillOn(b,X,Y,T,T,pal[Math.floor(R()*pal.length)]);
    for(let i=0;i<5;i++){
      const bx=X+Math.floor(R()*15), by=Y+Math.floor(R()*15);
      fillOn(b,bx,by,1,2,R()<.5?'#77B864':'#4A7E3E');
    }
  }
  for(let ty=0;ty<VH;ty++)for(let tx=0;tx<VW;tx++){
    if(!isPath(tx,ty)) continue;
    const X=tx*T, Y=ty*T;
    fillOn(b,X,Y,T,T,'#C9A56A');
    fillOn(b,X+2+(tx%3),Y+3,4,3,'#B8925A');
    fillOn(b,X+9,Y+9-(ty%2),4,3,'#D9B98A');
    fillOn(b,X,Y+T-1,T,1,'#A88050');
  }
  fillOn(b,(POND.x0-1)*T,(POND.y0-1)*T,(POND.x1-POND.x0+3)*T,(POND.y1-POND.y0+3)*T,'#D9C48E');
  for(let y=POND.y0;y<=POND.y1;y++)for(let x=POND.x0;x<=POND.x1;x++){
    const X=x*T, Y=y*T;
    fillOn(b,X,Y,T,T,(x+y)%2?'#2E6FB0':'#2A67A6');
    fillOn(b,X+2,Y+4,5,1,'#5C9ED8');
    fillOn(b,X+9,Y+11,4,1,'#4D8ACB');
  }
  for(let i=0;i<46;i++){
    const tx=Math.floor(R()*VW), ty=Math.floor(R()*VH);
    if(BLK.has(key(tx,ty))||isPath(tx,ty)||npcAt.has(key(tx,ty))) continue;
    flower(tx*T,ty*T,R);
  }
  pavilion();
  for(let x=0;x<VW;x++){ tree(x*T,0); tree(x*T,(VH-1)*T); }
  for(let y=1;y<VH-1;y++){ tree(0,y*T); tree((VW-1)*T,y*T); }
  TREES.forEach(([x,y])=>tree(x*T,y*T));
  BLDS.forEach(building);
  LANTERNS.forEach(([x,y])=>lantern(x*T,y*T));
}

/* ---------- 人物像素繪製 ---------- */
function human(X,Y,o,dir,step,bob,alert){
  const ax=X+2, ay=Y-2+bob, K=o.line;
  fillOn(g,ax+1,Y+12,10,2,'rgba(0,0,0,.32)');
  const lu=step===1, ru=step===2;
  fillOn(g,ax+3,ay+12,2,lu?1:2,o.pants); fillOn(g,ax+3,ay+(lu?13:14),2,1,o.shoe);
  fillOn(g,ax+7,ay+12,2,ru?1:2,o.pants); fillOn(g,ax+7,ay+(ru?13:14),2,1,o.shoe);
  fillOn(g,ax+2,ay+6,8,7,K);
  fillOn(g,ax+3,ay+7,6,5,o.cloth);
  fillOn(g,ax+3,ay+10,6,1,o.acc);
  fillOn(g,ax+2,ay+7,1,4,o.cloth); fillOn(g,ax+9,ay+7,1,4,o.cloth);
  fillOn(g,ax+2,ay+11,1,1,o.skin); fillOn(g,ax+9,ay+11,1,1,o.skin);
  fillOn(g,ax+3,ay,6,7,K);
  fillOn(g,ax+4,ay+1,4,5,o.skin);
  fillOn(g,ax+4,ay,4,2,o.hair); fillOn(g,ax+3,ay+1,1,2,o.hair); fillOn(g,ax+8,ay+1,1,2,o.hair);
  if(dir===3){
    fillOn(g,ax+4,ay+1,4,3,o.hair);
  }else{
    const e='#1A1C1A';
    if(dir===0){ fillOn(g,ax+5,ay+3,1,1,e); fillOn(g,ax+7,ay+3,1,1,e); fillOn(g,ax+6,ay+5,1,1,'#B5654A'); }
    if(dir===1){ fillOn(g,ax+4,ay+3,1,1,e); }
    if(dir===2){ fillOn(g,ax+7,ay+3,1,1,e); }
  }
  if(o.beard) fillOn(g,ax+4,ay+5,4,2,'#D8D8DE');
  if(o.kind==='crown'){
    fillOn(g,ax+4,ay-1,4,1,o.acc); fillOn(g,ax+4,ay-2,1,1,o.acc);
    fillOn(g,ax+6,ay-2,1,1,o.acc); fillOn(g,ax+7,ay-2,1,1,o.acc);
  }
  if(o.kind==='hat'){
    fillOn(g,ax+2,ay+1,8,1,o.acc); fillOn(g,ax+4,ay-2,4,3,o.acc);
    fillOn(g,ax+4,ay,4,1,'rgba(0,0,0,.25)');
  }
  if(o.kind==='bag'){
    fillOn(g,ax+10,ay+7,2,4,o.acc); fillOn(g,ax+10,ay+9,2,1,'#5A3A22');
  }
  if(alert){
    const blink=Math.floor(performance.now()/380)%2===0;
    if(blink){ fillOn(g,ax+5,ay-6,2,3,'#FFD27A'); fillOn(g,ax+5,ay-2,2,1,'#FFD27A'); }
  }
}
function dirOf(dx,dy){ if(dy>0)return 0; if(dx<0)return 1; if(dx>0)return 2; return 3; }

/* ---------- 玩家與移動 ---------- */
const P={x:12,y:14,vx:12,vy:14,dir:0,path:[],after:null,last:0};

function walkable(x,y){
  if(x<0||y<0||x>=VW||y>=VH) return false;
  const k=key(x,y);
  return !BLK.has(k)&&!npcAt.has(k);
}
function findPath(sx,sy,tx,ty){
  if(sx===tx&&sy===ty) return [];
  const prev=new Map(); const q=[[sx,sy]]; prev.set(key(sx,sy),null);
  let found=false;
  for(let qi=0;qi<q.length;qi++){
    const [x,y]=q[qi];
    if(x===tx&&y===ty){found=true;break;}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy, k=key(nx,ny);
      if(prev.has(k)) continue;
      if(!walkable(nx,ny)&&!(nx===tx&&ny===ty)) continue;
      prev.set(k,[x,y]); q.push([nx,ny]);
    }
  }
  if(!found) return null;
  const path=[]; let cur=[tx,ty];
  while(cur && !(cur[0]===sx&&cur[1]===sy)){ path.unshift(cur); cur=prev.get(key(cur[0],cur[1])); }
  return path;
}
function tapTile(tx,ty){
  if(tx<0||ty<0||tx>=VW||ty>=VH) return;
  const n=npcAt.get(key(tx,ty));
  if(n){ walkNear(n); return; }
  if(!walkable(tx,ty)) return;
  const p=findPath(P.x,P.y,tx,ty);
  if(p && p.length){ hideCard(); P.path=p; P.after=null; }
  else if(!p) toast('走不過去，換個位置試試');
}
function walkNear(n){
  hideCard();
  if(Math.abs(n.x-P.x)+Math.abs(n.y-P.y)===1){ P.dir=dirOf(n.x-P.x,n.y-P.y); openCard(n); return; }
  let best=null;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const ax=n.x+dx, ay=n.y+dy;
    if(!walkable(ax,ay)) continue;
    const p=findPath(P.x,P.y,ax,ay);
    if(p && (!best || p.length<best.length)) best=p;
  }
  if(!best){ toast('走不過去，換個位置試試'); return; }
  P.path=best;
  P.after=()=>{ P.dir=dirOf(n.x-P.x,n.y-P.y); openCard(n); };
}
function stepPlayer(t){
  if(!P.path.length) return;
  if(t-P.last<130) return;
  P.last=t;
  const [nx,ny]=P.path.shift();
  P.dir=dirOf(nx-P.x,ny-P.y);
  P.x=nx; P.y=ny;
  if(!P.path.length && P.after){ const f=P.after; P.after=null; f(); }
}

/* ---------- 標籤與格子清單 ---------- */
function buildLabels(){
  const box=document.getElementById('vLbls');
  NPC.forEach(n=>{
    const el=document.createElement('div');
    el.className='vLbl';
    el.textContent=n.name;
    el.style.left=((n.x+.5)/VW*100)+'%';
    el.style.top=((n.y*T-4)/H*100)+'%';
    box.appendChild(el);
    n._el=el;
  });
}
function updateLabels(){
  NPC.forEach(n=>n._el.classList.toggle('hot', Math.abs(n.x-P.x)+Math.abs(n.y-P.y)===1));
}
function buildGrid(){
  const box=document.getElementById('vGrid');
  box.innerHTML=NPC.map(n=>'<button class="vchip" type="button" data-id="'+n.id+'"><span>'+n.ic+'</span>'+n.name+'</button>').join('');
  box.querySelectorAll('.vchip').forEach(bt=>bt.onclick=()=>{
    const n=NPC.find(x=>x.id===bt.dataset.id); if(n) walkNear(n);
  });
}

/* ---------- 光影與動態 ---------- */
function isNight(){
  const h=+new Intl.DateTimeFormat('en-US',{hour:'numeric',hour12:false,timeZone:'Asia/Taipei'}).format(new Date())%24;
  return h>=18||h<6;
}
function bobOf(i,t){ return Math.sin(t/520+i*1.9)>0.55?-1:0; }

function render(t){
  g.globalCompositeOperation='source-over';
  g.drawImage(bgC,0,0);

  // 水面閃光
  for(let y=POND.y0;y<=POND.y1;y++)for(let x=POND.x0;x<=POND.x1;x++){
    const o=((t/700)+x*2.3+y*1.7)%1;
    fillOn(g,x*T+Math.floor(o*12)+1,y*T+5+((x+y)%3)*3,3,1,'rgba(255,255,255,.6)');
  }

  // 人物與 NPC（依 y 排序，形成前後遮擋）
  const list=NPC.map((n,i)=>({y:n.y,draw:()=>{
    const d=Math.abs(n.x-P.x)+Math.abs(n.y-P.y)<=2 ? dirOf(P.x-n.x,P.y-n.y) : 0;
    human(n.x*T,n.y*T,n.look,d,0,bobOf(i,t),Math.abs(n.x-P.x)+Math.abs(n.y-P.y)===1);
  }}));
  const walking=P.path.length>0;
  const pStep=walking ? (Math.floor(t/130)%2===0?1:2) : 0;
  list.push({y:P.vy,draw:()=>{
    fillOn(g,P.vx*T+3,P.vy*T+13,10,2,'rgba(231,194,122,.35)');
    human(P.vx*T,P.vy*T,PLAYER_LOOK,P.dir,pStep,0,false);
  }});
  list.sort((a,c)=>a.y-c.y).forEach(o=>o.draw());

  // 夜間光效
  const night=isNight();
  if(night){
    fillOn(g,0,0,W,H,'rgba(12,22,64,.42)');
  }else{
    fillOn(g,0,0,W,H,'rgba(255,200,120,.05)');
  }
  g.globalCompositeOperation='lighter';
  const glowA=night?0.5:0.14;
  LANTERNS.forEach(([x,y])=>{
    const cx=x*T+8, cy=y*T+6;
    const rg=g.createRadialGradient(cx,cy,1,cx,cy,night?26:16);
    rg.addColorStop(0,'rgba(255,190,100,'+glowA+')');
    rg.addColorStop(1,'rgba(255,190,100,0)');
    g.fillStyle=rg; g.fillRect(cx-28,cy-28,56,56);
  });
  if(night){
    for(let i=0;i<16;i++){
      const fx=(i*97.3+t*0.012*(1+i%3))%W;
      const fy=60+(i*53.7)%(H-80)+Math.sin(t/500+i)*6;
      const a=0.4+0.4*Math.sin(t/300+i);
      g.fillStyle='rgba(255,240,150,'+a.toFixed(2)+')';
      g.fillRect(Math.round(fx),Math.round(fy),1,1);
      g.fillStyle='rgba(255,240,150,'+(a*0.25).toFixed(2)+')';
      g.fillRect(Math.round(fx)-1,Math.round(fy)-1,3,3);
    }
  }
  g.globalCompositeOperation='source-over';

  // 暗角
  const vg=g.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,W*0.62);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.45)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
}

/* ---------- 迴圈與輸入 ---------- */
function loop(t){
  requestAnimationFrame(loop);
  if(!document.body.classList.contains('v-mode')) return;
  stepPlayer(t);
  P.vx+=(P.x-P.vx)*0.32; P.vy+=(P.y-P.vy)*0.32;
  if(Math.abs(P.x-P.vx)<0.01) P.vx=P.x;
  if(Math.abs(P.y-P.vy)<0.01) P.vy=P.y;
  render(t);
  updateLabels();
}

cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)/r.width*W, my=(e.clientY-r.top)/r.height*H;
  tapTile(Math.floor(mx/T), Math.floor(my/T));
});

document.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('v-mode')) return;
  if(!document.getElementById('vCard').hidden) return;
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
  const d=m[e.key]; if(!d) return;
  e.preventDefault();
  const nx=P.x+d[0], ny=P.y+d[1];
  if(walkable(nx,ny)){ P.path=[[nx,ny]]; P.after=null; }
  else P.dir=dirOf(d[0],d[1]);
});

/* ---------- 啟動 ---------- */
buildBG();
buildLabels();
buildGrid();
window.vzSetMode=setMode;
setMode('village');
requestAnimationFrame(loop);
setInterval(()=>{ if(document.body.classList.contains('v-mode')) renderVillage(); },3000);
})();
</script>
